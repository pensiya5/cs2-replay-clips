name: Windows build and tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Update Rust
        run: rustup update stable
      - name: Build without NASM
        run: cargo +stable build --locked --release --no-default-features
      - name: Run tests
        run: cargo +stable test --locked --release --no-default-features
      - name: Check command-line entry point
        run: .\target\release\cs2-replay-clips.exe --help
